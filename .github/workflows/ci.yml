name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meson-setup:
    name: Meson project, daemon and PAM validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and PAM headers
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libpam0g-dev libsystemd-dev dbus
      - name: Configure
        run: meson setup builddir
      - name: Compile
        run: meson compile -C builddir
      - name: Run tests
        run: meson test -C builddir --print-errorlogs
      - name: Check daemon CLI
        run: |
          builddir/dinit-logind --version
          builddir/dinit-logind --help
